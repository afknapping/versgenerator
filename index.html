<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Versgenerator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <div class="layout">
      <section class="preview-wrap">
        <div class="canvas-stage">
          <canvas id="preview-canvas"></canvas>
          <div id="grid-overlay" class="grid-overlay" aria-hidden="true"></div>
          <div id="wallpaper-safe-overlay" class="safe-zone-overlay" aria-hidden="true" hidden>
            <div class="safe-zone-band safe-zone-top"><span>Clock / status bar</span></div>
            <div class="safe-zone-band safe-zone-bottom"><span>Widgets / shortcuts / nav bar</span></div>
          </div>
        </div>
        <p id="photo-credit" class="credit" hidden></p>
        <input id="upload-input" type="file" accept="image/*" hidden />
      </section>

      <div class="side">
        <button id="panel-toggle" type="button" class="link-button">Hide settings</button>

        <div id="panel-content">
        <section class="controls">
          <div class="control-row">
            <input id="reference-input" type="text" placeholder="e.g. John 3:16 or Psalm 23:1-6" />
          </div>
          <div class="control-row">
            <select id="translation-select">
              <option value="schlachter">Schlachter 2000</option>
              <option value="kjv">KJV</option>
            </select>
          </div>
          <p id="reference-error" class="error" hidden></p>

          <div class="control-divider"></div>

          <div class="control-row">
            <div id="font-buttons" class="toggle-group"></div>
          </div>

          <div class="control-row control-col">
            <label for="text-size-slider">Text size</label>
            <input id="text-size-slider" type="range" min="20" max="160" value="100" />
          </div>

          <div class="control-row">
            <div id="text-theme-buttons" class="toggle-group"></div>
          </div>

          <div class="control-divider"></div>

          <div class="control-row">
            <div id="aspect-buttons" class="toggle-group"></div>
          </div>

          <div class="control-divider"></div>

          <div class="control-row">
            <div id="source-buttons" class="toggle-group"></div>
          </div>
          <p id="photo-error" class="error" hidden></p>

          <div class="control-row control-col">
            <label for="zoom-slider">Zoom</label>
            <input id="zoom-slider" type="range" min="100" max="300" value="100" />
          </div>

          <div class="control-row">
            <div id="filter-buttons" class="toggle-group"></div>
          </div>
        </section>

        <div class="control-divider"></div>

        <section id="save-standard" class="save-row save-col">
          <button id="save-standard-btn" type="button">
            <svg class="icon-download" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 1v8m0 0L4.5 5.5M8 9l3.5-3.5M2 12.5h12" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Save
          </button>
          <button id="save-highres-btn" type="button" class="link-button">
            <svg class="icon-download" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 1v8m0 0L4.5 5.5M8 9l3.5-3.5M2 12.5h12" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            save high resolution version
          </button>
        </section>
        <section id="save-wide" class="save-row" hidden>
          <button id="save-hd-btn" type="button">
            <svg class="icon-download" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 1v8m0 0L4.5 5.5M8 9l3.5-3.5M2 12.5h12" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Save HD
          </button>
          <button id="save-4k-btn" type="button">
            <svg class="icon-download" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 1v8m0 0L4.5 5.5M8 9l3.5-3.5M2 12.5h12" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Save 4K
          </button>
        </section>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
